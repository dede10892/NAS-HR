<footer class="site-footer">

  <div class="container footer-top">
    <div class="footer-brand">
      <a href="#" class="footer-logo-link">
        <img src="logo-light.svg" class="footer-logo-img" alt="NAS HR">
      </a>
      <div class="footer-socials">
        <a href="#" aria-label="LinkedIn">in</a>
        <a href="#" aria-label="Twitter">𝕏</a>
        <a href="#" aria-label="YouTube">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 00.5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 002.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 002.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.75 15.5v-7l6.5 3.5-6.5 3.5z"/>
          </svg>
        </a>
      </div>
    </div>
    <div class="footer-cols">
      @for (col of cols; track col.head_en) {
        <div class="footer-col">
          <h4 class="footer-col-head">{{ col.head_en }}</h4>
          <ul>
            @for (link of col.links; track link.en) {
              <li>
                @if (link.route) {
                  <a [routerLink]="link.route">{{ link.en }}</a>
                } @else {
                  <a href="#">{{ link.en }}</a>
                }
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>

  <div class="footer-bottom">
    <div class="container footer-bottom-inner">
      <span>© {{ year }} NAS HR. All rights reserved.</span>
      <div class="footer-bottom-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Cookies</a>
      </div>
    </div>
  </div>

</footer>
