<section class="trusted-section">
  <div class="container trusted-inner">

    <!-- Centered title -->
    <p class="trusted-title">
      {{ t('Trusted by', 'يثق به') }}
      <span class="tl-num"><span appCountUp="3000">3,000</span><span class="tl-plus">+</span></span>
      {{ t('Employees across different industries', 'موظف في مختلف القطاعات') }}
    </p>

    <!-- Marquee logo strip -->
    <div class="trusted-marquee">
      <div class="marquee-track">
        @for (c of track; track $index) {
          <div class="logo-card">
            <img
              [src]="'logos/' + c.logo"
              [alt]="c.name"
              [style.width.px]="c.width"
              class="logo-img"
              loading="lazy"
              (error)="onImgError($event, c.name)"
            />
          </div>
        }
      </div>
    </div>

  </div>
</section>
